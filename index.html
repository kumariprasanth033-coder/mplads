<!doctype html>
<html lang="en" class="dark" data-theme="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPLADS Smart &amp; AI Powered Portal</title>
    <meta name="description" content="Transparent, Intelligent, Accountable and Citizen-Centric AI-assisted governance layer for the MPLADS workflow." />
    <meta property="og:title" content="MPLADS Smart &amp; AI Powered Portal" />
    <meta property="og:description" content="Transparent, Intelligent, Accountable and Citizen-Centric AI-assisted governance layer for the MPLADS workflow." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          localStorage.setItem('mplads-theme', 'dark');
          var doc = document.documentElement;
          doc.classList.remove('light');
          doc.classList.add('dark');
          doc.setAttribute('data-theme', 'dark');
          doc.style.colorScheme = 'dark';
          doc.style.backgroundColor = '#0f172a';
          if (document.body) {
            document.body.classList.remove('light');
            document.body.classList.add('dark');
            document.body.style.backgroundColor = '#0f172a';
            document.body.style.color = '#f1f5f9';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
